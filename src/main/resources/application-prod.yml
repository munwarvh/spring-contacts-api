server:
  port: 8081

spring:
  sql:
    init:
      platform: postgres
      mode: never
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      use-long-for-ints: true

logging:
  level:
    org:
      hibernate:
        SQL: warn
        type: error
    nl.craftsmen: info

security:
  apikey: ${CONTACTS_APIKEY}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    enabled: false
