server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:contactsdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      use-long-for-ints: true

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type: trace
    nl.craftsmen: debug

security:
  apikey: local-test-api-key-12345

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

