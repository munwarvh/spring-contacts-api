server:
  port: 8081

spring:
  sql:
    init:
      platform: postgres
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5432/contacts_dev
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      use-long-for-ints: true

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type: trace
    nl.craftsmen: debug

security:
  apikey: ${CONTACTS_APIKEY:dev-api-key-67890}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

